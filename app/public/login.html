<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · ShipDesk</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main style="max-width: 420px">
    <div class="card">
      <h1>Sign in to ShipDesk</h1>
      <div role="alert" id="login-error" class="alert" hidden></div>
      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="actions"><button type="submit">Sign in</button></div>
      </form>
    </div>
  </main>
  <script src="/common.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('login-error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.hidden = true;
      const button = form.querySelector('button');
      button.disabled = true;
      const { ok, body } = await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email: form.email.value, password: form.password.value }),
      });
      button.disabled = false;
      if (!ok) {
        error.textContent = (body && body.error) || 'Sign in failed';
        error.hidden = false;
        return;
      }
      const next = new URLSearchParams(location.search).get('next');
      location.assign(next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
    });
  </script>
</body>
</html>
